org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=true
# Google Play Services Cronet currently brings cronet-api and cronet-shared
# with the same org.chromium.net namespace. Keep AGP 8.x behavior until those
# upstream AARs expose unique namespaces.
android.uniquePackageNames=false
# Temporary AGP 9 compatibility: the app and several Flutter plugins still
# apply the Kotlin Gradle Plugin. Remove after all Android plugins support
# AGP's built-in Kotlin integration.
android.builtInKotlin=false
# Temporary AGP 9 compatibility for Flutter build logic and the legacy
# applicationVariants ABI version-code overrides in app/build.gradle.
android.newDsl=false
