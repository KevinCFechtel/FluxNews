name: Submit F-Droid Update

on:
  workflow_call:
    inputs:
      release_tag:
        description: "GitHub release tag to submit"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to submit, for example v2.2.5"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: submit-fdroid-signatures
  cancel-in-progress: false

jobs:
  submit-signatures:
    name: Submit F-Droid update and signatures
    runs-on: ubuntu-latest
    env:
      APP_ID: de.circle_dev.flux_news
      DEVELOPER_SIGNING_KEY: fee5401bc9d59cf5a8a461ba9698c482e87ed8ffb9258786a3d01d0356ea2ebb
      FDROID_SIGNING_KEY: d8e5c241fc3ed7e8b1fdcfb237e4b2680e763e3c2c1412c91ff568d6c57eabd7
      FDROID_GITLAB_FORK: ${{ vars.FDROID_GITLAB_FORK }}
      FDROID_GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Test F-Droid metadata automation
        run: python3 .github/scripts/test_prepare_fdroid_metadata.py

      - name: Check configuration
        run: |
          if [[ -z "${FDROID_GITLAB_FORK}" ]]; then
            echo "::error::Repository variable FDROID_GITLAB_FORK is not configured"
            exit 1
          fi
          if [[ -z "${FDROID_GITLAB_TOKEN}" ]]; then
            echo "::error::Repository secret FDROID_GITLAB_TOKEN is not configured"
            exit 1
          fi

      - name: Select release
        id: release
        run: |
          if [[ -n "${INPUT_RELEASE_TAG}" ]]; then
            tag="${INPUT_RELEASE_TAG}"
          else
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported release tag: ${tag}"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Download GitHub release assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/github-apks" "${RUNNER_TEMP}/signatures"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/github-apks" \
            --pattern "fdroid-signatures-v${RELEASE_VERSION}.tar.gz"

          tar -xzf \
            "${RUNNER_TEMP}/github-apks/fdroid-signatures-v${RELEASE_VERSION}.tar.gz" \
            -C "${RUNNER_TEMP}/signatures"

      - name: Determine F-Droid version codes
        id: version_codes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          pubspec="$(
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/pubspec.yaml?ref=${RELEASE_TAG}"
          )"
          base_version_code="$(
            printf '%s\n' "${pubspec}" |
              sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p'
          )"

          if [[ -z "${base_version_code}" ]]; then
            echo "::error::Could not read the base version code from ${RELEASE_TAG}"
            exit 1
          fi

          declared_version="$(
            printf '%s\n' "${pubspec}" |
              sed -n 's/^version: \([^+]*\)+[0-9][0-9]*$/\1/p'
          )"
          if [[ "${declared_version}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match pubspec version ${declared_version}"
            exit 1
          fi

          release_commit="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
              --jq .sha
          )"
          if [[ ! "${release_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve ${RELEASE_TAG} to a full commit SHA"
            exit 1
          fi

          echo "base=${base_version_code}" >> "${GITHUB_OUTPUT}"
          echo "commit=${release_commit}" >> "${GITHUB_OUTPUT}"
          echo "x86_64=$((base_version_code + 1))" >> "${GITHUB_OUTPUT}"
          echo "armeabi_v7a=$((base_version_code + 2))" >> "${GITHUB_OUTPUT}"
          echo "arm64_v8a=$((base_version_code + 3))" >> "${GITHUB_OUTPUT}"

          for version_code in \
            "$((base_version_code + 1))" \
            "$((base_version_code + 2))" \
            "$((base_version_code + 3))"; do
            signature_dir="${RUNNER_TEMP}/signatures/metadata/${APP_ID}/signatures/${version_code}"
            if [[ ! -d "${signature_dir}" ]] ||
               [[ -z "$(find "${signature_dir}" -maxdepth 1 -type f -size +0c -print -quit)" ]]; then
              echo "::error::Signature archive has no files for version code ${version_code}"
              exit 1
            fi
          done

      - name: Prepare F-Droid update metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version_codes.outputs.commit }}
          BASE_VERSION_CODE: ${{ steps.version_codes.outputs.base }}
        run: |
          checkout="${RUNNER_TEMP}/fdroiddata"
          metadata="${checkout}/metadata/${APP_ID}.yml"

          git clone --filter=blob:none --no-checkout \
            https://gitlab.com/fdroid/fdroiddata.git "${checkout}"
          git -C "${checkout}" sparse-checkout init --no-cone
          git -C "${checkout}" sparse-checkout set \
            "metadata/${APP_ID}.yml" \
            "metadata/${APP_ID}/signatures/"
          git -C "${checkout}" checkout master

          python3 \
            "${GITHUB_WORKSPACE}/.github/scripts/prepare_fdroid_metadata.py" \
            --metadata "${metadata}" \
            --version "${RELEASE_VERSION}" \
            --base-version-code "${BASE_VERSION_CODE}" \
            --commit "${RELEASE_COMMIT}" \
            --developer-key "${DEVELOPER_SIGNING_KEY}" \
            --fdroid-key "${FDROID_SIGNING_KEY}"

      - name: Submit update and signatures to fdroiddata
        id: submit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          checkout="${RUNNER_TEMP}/fdroiddata"
          branch="fluxnews-signatures-${RELEASE_TAG}"
          metadata="${checkout}/metadata/${APP_ID}.yml"
          signature_source="${RUNNER_TEMP}/signatures/metadata/${APP_ID}/signatures"

          mkdir -p "${checkout}/metadata/${APP_ID}/signatures"
          cp -a "${signature_source}/." \
            "${checkout}/metadata/${APP_ID}/signatures/"

          cd "${checkout}"
          git switch -c "${branch}"
          git config user.name "Flux News release bot"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add \
            "metadata/${APP_ID}.yml" \
            "metadata/${APP_ID}/signatures"

          if git diff --cached --quiet; then
            echo "Developer signatures for ${RELEASE_TAG} are already present"
            echo "complete=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "Update Flux News to ${RELEASE_VERSION} with developer signatures"
          git remote add fork \
            "https://oauth2:${FDROID_GITLAB_TOKEN}@gitlab.com/${FDROID_GITLAB_FORK}.git"

          remote_branch="$(
            git ls-remote --heads fork "refs/heads/${branch}" |
              awk '{ print $1 }'
          )"

          description="$(
            printf '%s\n\n%s' \
              "Updates Flux News to ${RELEASE_VERSION} and adds the developer signatures for dual publication." \
              "The x86_64, armeabi-v7a, and arm64-v8a build entries use the latest existing F-Droid recipes. AutoUpdateMode remains disabled because every release requires matching signature data."
          )"
          if [[ -n "${remote_branch}" ]]; then
            git push \
              "--force-with-lease=refs/heads/${branch}:${remote_branch}" \
              fork "HEAD:refs/heads/${branch}"
          else
            git push \
              -o merge_request.create \
              -o merge_request.target=master \
              -o merge_request.target_project=fdroid/fdroiddata \
              -o merge_request.remove_source_branch \
              -o merge_request.title="Update Flux News to ${RELEASE_VERSION} with developer signatures" \
              -o merge_request.description="${description}" \
              fork "HEAD:refs/heads/${branch}"
          fi

          echo "complete=true" >> "${GITHUB_OUTPUT}"
