name: Dependency security (RustSec)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/Cargo.lock"
      - "core/Cargo.toml"
      - "core/crates/**/Cargo.toml"
      - ".github/workflows/dependency-security.yml"
      - "Build/rustsec_gate.py"
      - "Build/test_rustsec_gate.py"

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ inputs.source_sha != '' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: ${{ inputs.base_sha != '' && 'RustSec regression gate' || 'RustSec full security audit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test audit parsing, comparison and fail-closed behavior
        run: python3 -m unittest discover -s Build -p test_rustsec_gate.py -v
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
      - name: Verify pinned Rust compiler
        run: rustc --version | grep -F 'rustc 1.99.1 '
      - name: Cache cargo audit binary and registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          key: cargo-audit-0.23.0
      - name: Install locked cargo-audit
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --version | grep -F '0.23.0'
      - name: Audit immutable source (PR regressions; full security gate with maintenance warnings otherwise)
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          args=(--output "$RUNNER_TEMP/rustsec-report")
          if [[ -n "$BASE_SHA" ]]; then args+=(--base "$BASE_SHA"); fi
          python3 Build/rustsec_gate.py "${args[@]}"
      - name: Preserve full audit reports and comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustsec-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rustsec-report/
          if-no-files-found: warn
          retention-days: 14
